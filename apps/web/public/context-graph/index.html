<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stacked layers</title>
    <style>
      :root {
        --bg: #fbfbfc;
        --ink: 20, 20, 24;
        --panel: #ffffffd9;
        --line: #e8e8ec;
        --muted: #8a8a94;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: rgb(var(--ink));
        font:
          13px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Inter",
          sans-serif;
        overflow: hidden;
      }
      #g {
        position: absolute;
        inset: 0;
      }
      .bar {
        position: absolute;
        left: 20px;
        top: 18px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
      }
      .bar h1 {
        font-size: 13px;
        font-weight: 500;
        margin: 0;
      }
      .bar h1 span {
        color: var(--muted);
        font-weight: 400;
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        pointer-events: auto;
      }
      .find {
        position: relative;
      }
      .find input {
        font: inherit;
        font-size: 12px;
        width: 200px;
        color: rgb(var(--ink));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 14px;
        outline: none;
      }
      .find input:focus {
        border-color: var(--muted);
      }
      .res {
        position: absolute;
        right: 0;
        top: 32px;
        width: 280px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 4px;
        display: none;
        box-shadow: 0 12px 36px #00000018;
        max-height: 300px;
        overflow: auto;
      }
      .res.show {
        display: block;
      }
      .res div {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 8px;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
      }
      .res div:hover,
      .res div.on {
        background: var(--hover, #f4f4f7);
      }
      .res i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }
      .res em {
        margin-left: auto;
        font-style: normal;
        color: var(--muted);
        font-size: 11px;
      }
      .res .none {
        color: var(--muted);
        cursor: default;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: rgb(var(--ink));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 12px;
        cursor: pointer;
        pointer-events: auto;
      }
      button:hover {
        border-color: var(--muted);
      }
      .layers {
        position: absolute;
        left: 20px;
        top: 56px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lc {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        cursor: pointer;
        color: rgb(var(--ink));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 12px 3px 10px;
        width: max-content;
      }
      .lc i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgb(var(--ink));
      }
      .lc em {
        font-style: normal;
        color: var(--muted);
        font-size: 11px;
      }
      .lc.off {
        color: var(--muted);
      }
      .areas {
        position: absolute;
        top: 218px;
        left: 20px;
        display: flex;
        max-height: min(45vh, 340px);
        max-width: 160px;
        flex-direction: column;
        gap: 5px;
        overflow: auto;
      }
      .areas:empty {
        display: none;
      }
      .areas button {
        width: 100%;
        padding: 4px 10px;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .areas button[aria-pressed="true"] {
        border-color: #8995af;
        background: #eef1f9;
      }
      .empty-stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      .empty-stage[hidden] {
        display: none;
      }
      .empty-stage .orbit {
        position: absolute;
        width: min(52vw, 430px);
        height: min(16vw, 125px);
        border: 2px dotted #adb7ce;
        border-radius: 50%;
        transform: rotate(-16deg);
        opacity: 0.6;
      }
      .empty-stage .orbit:nth-child(1) {
        margin-top: -205px;
        border-color: #c6a1b2;
      }
      .empty-stage .orbit:nth-child(2) {
        margin-top: -85px;
        border-color: #bbaad0;
      }
      .empty-stage .orbit:nth-child(3) {
        margin-top: 35px;
        border-color: #839bc6;
      }
      .empty-stage .orbit:nth-child(4) {
        margin-top: 155px;
        border-color: #8fb4b3;
      }
      .empty-stage p {
        position: absolute;
        bottom: 64px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: #666b78;
        text-align: center;
      }
      .key {
        position: absolute;
        left: 14px;
        bottom: 12px;
        display: flex;
        gap: 16px;
        color: var(--muted);
        font-size: 11.5px;
        pointer-events: none;
        background: #fbfbfcd9;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 14px;
      }
      .key i {
        display: inline-block;
        vertical-align: middle;
        margin-right: 7px;
        border-radius: 50%;
      }
      .key i.barrel {
        width: 9px;
        height: 11px;
        border-radius: 5px/3px;
        background: #9aa1a8;
      }
      .key .a {
        margin-left: 4px;
      }
      .key .a i {
        width: 8px;
        height: 8px;
      }
    </style>
  </head>
  <body>
    <div id="g"></div>
    <div
      class="empty-stage"
      id="empty-stage"
      aria-label="Four empty knowledge layers; no accepted documents yet"
    >
      <div class="orbit"></div>
      <div class="orbit"></div>
      <div class="orbit"></div>
      <div class="orbit"></div>
      <p>AI layer ready · Documents appear after approval</p>
    </div>
    <div class="bar">
      <h1>
        Current context <span>&middot; 4 layers &middot; <span id="n"></span> nodes</span>
      </h1>
      <div class="tools">
        <div class="find">
          <input id="q" placeholder="Find a node" autocomplete="off" spellcheck="false" />
          <div class="res" id="res"></div>
        </div>
        <button id="reset">Reset view</button>
      </div>
    </div>
    <div class="layers" id="layers"></div>
    <div class="areas" id="areas" aria-label="Filter knowledge by area"></div>
    <div class="key">
      <span><i style="width: 3px; height: 3px; background: #9aa1a8"></i>Document</span>
    </div>

    <script src="/context-graph/3d-force-graph.min.js"></script>
    <script>
      const RAD = 170,
        GAP = 124;
      const LAYERS = [
        { id: "metrics", name: "Metrics", y: GAP * 1.5 },
        { id: "business", name: "Business", y: GAP * 0.5 },
        { id: "ai", name: "AI", y: -GAP * 0.5 },
        { id: "data", name: "Data", y: -GAP * 1.5 },
      ];
      const hx = (h) => [
        parseInt(h.slice(1, 3), 16),
        parseInt(h.slice(3, 5), 16),
        parseInt(h.slice(5, 7), 16),
      ];
      const tint = (base, c, k) => {
        const A = hx(base),
          B = hx(c);
        return (
          "#" +
          A.map((v, i) =>
            Math.round(v * (1 - k) + B[i] * k)
              .toString(16)
              .padStart(2, "0"),
          ).join("")
        );
      };
      const LC = { data: "#5f9e9c", ai: "#53659f", business: "#9a88c7", metrics: "#c68399" };
      const nodes = [],
        links = [],
        docs = [];
      document.getElementById("n").textContent = "0";

      const byId = new Map(nodes.map((n) => [n.id, n]));
      const ob = (x) => (typeof x === "object" ? x : byId.get(x));
      const nb = new Map(nodes.map((n) => [n.id, new Set([n.id])]));
      links.forEach((l) => {
        nb.get(l.source).add(l.target);
        nb.get(l.target).add(l.source);
      });
      const hidden = new Set();
      let activeArea = null;
      let hover = null,
        sel = null;
      const scopes = { general: true, area: true, individual: true };
      let proposalMode = false;
      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
        );
      const scopeOf = (n) =>
        n.areaId === "personal" ? "individual" : n.areaId === "general" ? "general" : "area";
      const scopeActive = (n) => n.ring || n.proposal || n.proposalGroup || scopes[scopeOf(n)];
      const describe = (n) => ({
        id: n.id,
        title: n.t,
        layer: n.layer,
        scope: scopeOf(n),
        kind: n.hub ? "source" : "document",
        owner: n.owner,
        connections: [...nb.get(n.id)]
          .filter((id) => id !== n.id)
          .map((id) => byId.get(id)?.t)
          .filter(Boolean)
          .slice(0, 6),
      });
      const vis = (n) => {
        const node = ob(n);
        return (
          node.proposal ||
          node.proposalGroup ||
          (!hidden.has(node.layer) && (!activeArea || node.areaId === activeArea))
        );
      };
      const lit = (n) => {
        if (proposalMode && !n.proposal && !n.proposalGroup) return false;
        const f = hover || sel;
        return !f || nb.get(f.id).has(n.id);
      };
      const mixW = (h, t) => {
        const n = parseInt(h.slice(1), 16),
          f = (c) =>
            Math.round(c + (255 - c) * t)
              .toString(16)
              .padStart(2, "0");
        return "#" + f(n >> 16) + f((n >> 8) & 255) + f(n & 255);
      };
      // grey dots with only a hint of the layer colour
      const nodeColor = (n) => {
        if (proposalMode && n.proposal) return "#ea580c";
        if (proposalMode && n.proposalGroup) return "#f97316";
        if (n.ring) return "#dcdee2";
        if (proposalMode) return "#e3e4e7";
        const c = n.hub ? tint("#6a6e76", LC[n.layer], 0.5) : tint("#a3a7ad", LC[n.layer], 0.42);
        return !scopeActive(n) ? mixW(c, 0.55) : lit(n) ? c : mixW(c, 0.85);
      };
      const dotOp = (n) =>
        proposalMode
          ? n.proposal
            ? 1
            : n.proposalGroup
              ? 0.9
              : n.ring
                ? 0.08
                : 0.14
          : !scopeActive(n)
            ? n.hub
              ? 0.32
              : 0.2
            : !lit(n)
              ? 0.12
              : n.hub
                ? 1
                : 0.9;
      const linkColor = (l) => {
        if (proposalMode) return l.kind === "proposal" ? "#fb923c" : "#eceef0";
        const f = hover || sel,
          a = ob(l.source),
          b = ob(l.target);
        const on = f && (a === f || b === f);
        if (!scopeActive(a) || !scopeActive(b)) return "#f1f2f4";
        if (f) return on ? "#5d666e" : "#f0f2f3";
        return l.kind === "leaf"
          ? "#d6dadd"
          : l.kind === "hub"
            ? "#97a0a8"
            : l.kind === "ref"
              ? "#c9cfd3"
              : "#b5bfc4";
      };

      const G = ForceGraph3D()(document.getElementById("g"))
        .backgroundColor("#fbfbfc")
        .showNavInfo(false)
        .graphData({ nodes, links })
        .nodeId("id")

        .nodeLabel((n) =>
          n.ring
            ? ""
            : `<div style="font:12px -apple-system,Inter,sans-serif;background:#17171aee;color:#fff;padding:3px 9px;border-radius:7px">${escapeHtml(n.t)}</div>`,
        )
        .nodeVisibility((n) => vis(n))
        .linkVisibility((l) => vis(l.source) && vis(l.target))
        .linkColor(linkColor)
        .linkOpacity(0.6)
        .linkWidth((l) => (l.kind === "cross" ? 0.3 : l.kind === "hub" ? 0.8 : 0.18))
        .linkCurvature((l) => (l.kind === "cross" ? 0.12 : 0))
        .enableNodeDrag(false)
        .warmupTicks(0)
        .cooldownTicks(0)
        .d3VelocityDecay(0.3)
        .onNodeHover((n) => {
          hover = n && !n.ring && (!proposalMode || n.proposal || n.proposalGroup) ? n : null;
          document.getElementById("g").style.cursor = hover ? "pointer" : "grab";
          refresh();
        })
        .onNodeClick((n) => {
          if (proposalMode) {
            const proposal = n?.proposal
              ? n
              : n?.proposalGroup
                ? nodes.find((entry) => entry.proposal && entry.groupId === n.groupId)
                : null;
            if (proposal) pickNode(proposal);
            return;
          }
          if (!n.ring) {
            sel = n;
            refresh();
            window.parent.postMessage({ type: "knowledge-node-selected", node: describe(n) }, "*");
          }
        })
        .onBackgroundClick(() => {
          sel = null;
          hover = null;
          refresh();
          window.parent.postMessage(
            { type: proposalMode ? "knowledge-proposal-cleared" : "knowledge-selection-cleared" },
            "*",
          );
        });
      const layerGuides = [];
      // reuse the library's own three.js classes: once the first default sphere exists, borrow its Mesh, material and geometry
      let SG,
        BG,
        Mesh,
        Mat,
        ringMat,
        r0 = 4;
      function mk(n) {
        if (n.ring) {
          const m = new Mesh(SG, ringMat);
          m.scale.setScalar(0.9 / r0);
          return m;
        }
        // flat dots: black base + emissive colour, so lights never shade them
        const mat = new Mat({
          color: "#000000",
          emissive: nodeColor(n),
          transparent: true,
          opacity: dotOp(n),
        });
        n.__mat = mat;
        const m = new Mesh(SG, mat);
        m.scale.setScalar((n.proposalGroup ? 6 : n.proposal ? 4.5 : n.hub ? 4.2 : 1.6) / r0);
        return m;
      }
      function useShapes() {
        const pm = nodes.find((n) => n.__threeObj)?.__threeObj;
        if (!pm) return;
        Mesh = pm.constructor;
        Mat = pm.material.constructor;
        SG = pm.geometry;
        r0 = SG.parameters.radius;
        BG = SG.clone();
        const P = BG.attributes.position;
        for (let i = 0; i < P.count; i++) {
          let x = P.getX(i) / r0,
            y = P.getY(i) / r0,
            z = P.getZ(i) / r0,
            y2;
          if (Math.abs(y) > 0.7) {
            y2 = Math.sign(y);
            x /= 0.714;
            z /= 0.714;
          } else {
            const l = Math.hypot(x, z) || 1;
            x /= l;
            z /= l;
            y2 = y / 0.7;
          }
          P.setXYZ(i, x * r0, y2 * 0.85 * r0, z * r0);
        }
        P.needsUpdate = true;
        BG.computeVertexNormals();
        ringMat = new Mat({ color: "#dcdee2" });
        // Plane outlines are scene decoration, never searchable knowledge nodes.
        if (!layerGuides.length && !proposalMode) {
          const geometry = SG.clone();
          for (const layer of LAYERS) {
            for (let index = 0; index < 110; index++) {
              const angle = (index / 110) * Math.PI * 2;
              const mesh = new Mesh(geometry, ringMat);
              mesh.scale.setScalar(0.9 / r0);
              mesh.position.set(
                Math.cos(angle) * (RAD + 10),
                layer.y,
                Math.sin(angle) * (RAD + 10),
              );
              mesh.visible = !hidden.has(layer.id);
              G.scene().add(mesh);
              layerGuides.push({ mesh, layer: layer.id });
            }
          }
        }
        G.nodeThreeObject(mk);
      }

      // each layer is a closed disc: nodes never leave their level, links are the only thing that cross
      function disc() {
        let ns = [];
        const f = (a) => {
          for (const n of ns) {
            if (n.ring) continue;
            const d = Math.hypot(n.x, n.z);
            if (d > RAD) {
              const k = ((RAD - d) / d) * a * 6;
              n.vx += n.x * k;
              n.vz += n.z * k;
            }
          }
        };
        f.initialize = (x) => {
          ns = x;
        };
        return f;
      }
      G.d3Force("disc", disc());
      G.d3Force("link")
        .distance((l) =>
          l.kind === "leaf" ? l.d : l.kind === "hub" ? 80 : l.kind === "ref" ? 70 : 100,
        )
        .strength((l) =>
          l.kind === "leaf" ? 0.9 : l.kind === "hub" ? 0.15 : l.kind === "ref" ? 0.01 : 0,
        );
      G.d3Force("charge")
        .strength((n) => (n.ring ? 0 : n.hub ? -110 : -8))
        .distanceMax(95);
      const HOME = { x: 0, y: 0, z: 600 };
      function resetView() {
        G.camera().up.set(0, 1, 0);
        G.cameraPosition(HOME, { x: 0, y: 0, z: 0 }, 0);
      }
      resetView();
      function refresh() {
        nodes.forEach((n) => {
          if (n.__mat) {
            n.__mat.emissive.set(nodeColor(n));
            n.__mat.opacity = dotOp(n);
          }
        });
        G.linkColor(linkColor);
        redraw();
      }
      function renderChips() {
        document.getElementById("layers").innerHTML = LAYERS.map(
          (L) =>
            `<div class="lc ${hidden.has(L.id) ? "off" : ""}" data-l="${L.id}"><i style="background:${hidden.has(L.id) ? "#d6d6dc" : tint("#6a6e76", LC[L.id], 0.5)}"></i>${L.name}<em>${docs.filter((n) => n.layer === L.id).length}</em></div>`,
        ).join("");
        document.querySelectorAll(".lc").forEach(
          (c) =>
            (c.onclick = () => {
              const l = c.dataset.l;
              hidden.has(l) ? hidden.delete(l) : hidden.add(l);
              layerGuides.forEach((guide) => {
                guide.mesh.visible = !hidden.has(guide.layer);
              });
              if (sel && hidden.has(sel.layer)) {
                sel = null;
                hover = null;
                window.parent.postMessage({ type: "knowledge-selection-cleared" }, "*");
              }
              G.nodeVisibility((n) => vis(n)).linkVisibility((l) => vis(l.source) && vis(l.target));
              renderChips();
              window.parent.postMessage({ type: "knowledge-layers", hidden: [...hidden] }, "*");
              redraw();
            }),
        );
      }
      renderChips();
      function renderAreas() {
        const counts = new Map();
        for (const doc of docs) counts.set(doc.areaId, (counts.get(doc.areaId) || 0) + 1);
        const areaPanel = document.getElementById("areas");
        areaPanel.replaceChildren();
        if (counts.size < 2) return;
        for (const [id, count] of [
          [null, docs.length],
          ...[...counts].sort(([a], [b]) => a.localeCompare(b)),
        ]) {
          const button = document.createElement("button");
          button.type = "button";
          button.title = id || "All areas";
          button.textContent = `${id || "All areas"} · ${count}`;
          button.setAttribute("aria-pressed", String(activeArea === id));
          button.onclick = () => {
            activeArea = id;
            if (sel && !vis(sel)) {
              sel = null;
              window.parent.postMessage({ type: "knowledge-selection-cleared" }, "*");
            }
            G.nodeVisibility((node) => vis(node)).linkVisibility(
              (link) => vis(link.source) && vis(link.target),
            );
            renderAreas();
            showRes();
            redraw();
          };
          areaPanel.append(button);
        }
      }
      // finder: filter by name and fly the camera to the pick
      const q = document.getElementById("q"),
        res = document.getElementById("res");
      let found = [],
        cur = 0;
      function showRes() {
        const t = q.value.trim().toLowerCase();
        if (!t) {
          res.classList.remove("show");
          found = [];
          return;
        }
        found = nodes
          .filter(
            (n) => (proposalMode ? n.proposal : !n.ring) && vis(n) && n.t.toLowerCase().includes(t),
          )
          .sort((a, b) => b.hub - a.hub || a.t.localeCompare(b.t))
          .slice(0, 8);
        cur = 0;
        res.innerHTML = found.length
          ? found
              .map(
                (n, i) =>
                  `<div data-i="${i}" class="${i ? "" : "on"}"><i style="background:${proposalMode ? "#ea580c" : tint("#6a6e76", LC[n.layer], 0.5)}"></i>${escapeHtml(n.t)}<em>${proposalMode ? "Pending" : LAYERS.find((l) => l.id === n.layer).name}</em></div>`,
              )
              .join("")
          : '<div class="none">No node with that name</div>';
        res.classList.add("show");
        res
          .querySelectorAll("[data-i]")
          .forEach((d) => (d.onclick = () => pickNode(found[+d.dataset.i])));
      }
      function pickNode(n) {
        if (!n) return;
        sel = n;
        refresh();
        res.classList.remove("show");
        q.blur();
        window.parent.postMessage(
          proposalMode
            ? { type: "knowledge-proposal-selected", id: n.proposalId }
            : { type: "knowledge-node-selected", node: describe(n) },
          "*",
        );
        G.cameraPosition(
          { x: n.x + 145, y: n.fy + 100, z: n.z + 290 },
          { x: n.x, y: n.fy, z: n.z },
          0,
        );
      }
      q.addEventListener("input", showRes);
      q.addEventListener("keydown", (e) => {
        if (e.key === "Enter") pickNode(found[cur]);
        else if (e.key === "Escape") {
          q.value = "";
          showRes();
          q.blur();
        } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          cur = Math.max(0, Math.min(found.length - 1, cur + (e.key === "ArrowDown" ? 1 : -1)));
          res.querySelectorAll("[data-i]").forEach((d, i) => d.classList.toggle("on", i === cur));
        }
      });
      document.getElementById("reset").onclick = () => {
        resetView();
        redraw();
      };
      function showNodes(previews) {
        proposalMode = false;
        document.getElementById("empty-stage").hidden = previews.length > 0;
        nodes.length = 0;
        links.length = 0;
        docs.length = 0;
        byId.clear();
        nb.clear();
        const counts = new Map();
        const totals = new Map();
        const areasByLayer = new Map(LAYERS.map((layer) => [layer.id, new Set()]));
        for (const p of previews) {
          if (!areasByLayer.has(p.layer)) continue;
          const key = p.areaId + ":" + p.layer;
          totals.set(key, (totals.get(key) || 0) + 1);
          areasByLayer.get(p.layer).add(p.areaId);
        }
        const frames = new Map();
        for (const layer of LAYERS) {
          const areas = [...areasByLayer.get(layer.id)].sort();
          const centerRadius = areas.length < 2 ? 0 : RAD * (areas.length === 2 ? 0.5 : 0.58);
          const clusterRadius =
            areas.length < 2
              ? RAD * 0.93
              : Math.min(
                  RAD - centerRadius - 8,
                  centerRadius * Math.sin(Math.PI / areas.length) - 6,
                );
          areas.forEach((areaId, index) => {
            const angle = (index / areas.length) * Math.PI * 2 + LAYERS.indexOf(layer) * 0.4;
            frames.set(areaId + ":" + layer.id, {
              cx: Math.cos(angle) * centerRadius,
              cz: Math.sin(angle) * centerRadius,
              radius: clusterRadius,
            });
          });
        }
        for (const p of previews) {
          const li = LAYERS.findIndex((l) => l.id === p.layer);
          if (li < 0) continue;
          const key = p.areaId + ":" + p.layer;
          const index = counts.get(key) || 0;
          counts.set(key, index + 1);
          const frame = frames.get(key);
          const total = totals.get(key);
          const radius = total === 1 ? 0 : frame.radius * Math.sqrt((index + 0.5) / total);
          const angle = index * 2.399963229728653;
          const x = frame.cx + Math.cos(angle) * radius;
          const z = frame.cz + Math.sin(angle) * radius;
          const node = {
            id: p.id,
            t: p.title,
            areaId: p.areaId,
            layer: p.layer,
            owner: p.areaId,
            li,
            x,
            z,
            fx: x,
            fz: z,
            fy: LAYERS[li].y,
          };
          nodes.push(node);
          docs.push(node);
          byId.set(node.id, node);
          nb.set(node.id, new Set([node.id]));
        }
        for (const p of previews) {
          for (const target of p.links || []) {
            if (!byId.has(p.id) || !byId.has(target)) continue;
            links.push({ source: p.id, target, kind: "ref" });
            nb.get(p.id).add(target);
            nb.get(target).add(p.id);
          }
        }
        sel = sel ? byId.get(sel.id) || null : null;
        if (activeArea && !docs.some((doc) => doc.areaId === activeArea)) activeArea = null;
        hover = null;
        document.getElementById("n").textContent = nodes.length;
        G.graphData({ nodes, links });
        setTimeout(useShapes, 50);
        renderChips();
        renderAreas();
        G.nodeVisibility((node) => vis(node)).linkVisibility(
          (link) => vis(link.source) && vis(link.target),
        );
        refresh();
        showRes();
      }
      function showProposals(proposals) {
        document.getElementById("empty-stage").hidden = true;
        proposalMode = true;
        for (let i = nodes.length - 1; i >= 0; i--) {
          if (nodes[i].proposal || nodes[i].proposalGroup) {
            byId.delete(nodes[i].id);
            nb.delete(nodes[i].id);
            nodes.splice(i, 1);
          }
        }
        for (let i = links.length - 1; i >= 0; i--) {
          if (links[i].kind === "proposal") links.splice(i, 1);
        }
        sel = null;
        hover = null;
        const valid = Array.isArray(proposals)
          ? proposals
              .filter(
                (p) =>
                  p &&
                  typeof p.id === "string" &&
                  typeof p.proposalId === "string" &&
                  typeof p.groupId === "string" &&
                  typeof p.title === "string" &&
                  typeof p.groupLabel === "string",
              )
              .slice(0, 300)
          : [];
        const groups = [...new Map(valid.map((p) => [p.groupId, p.groupLabel])).entries()].sort(
          ([a], [b]) => a.localeCompare(b),
        );
        groups.forEach(([groupId, groupLabel], groupIndex) => {
          const angle = (groupIndex / groups.length) * Math.PI * 2 - Math.PI / 2;
          const x = Math.cos(angle) * 245,
            z = Math.sin(angle) * 245;
          const group = {
            id: `proposal-group:${groupId}`,
            proposalGroup: true,
            groupId,
            t: groupLabel,
            layer: "business",
            x,
            z,
            fx: x,
            fy: 0,
            fz: z,
          };
          nodes.push(group);
          byId.set(group.id, group);
          nb.set(group.id, new Set([group.id]));
          valid
            .filter((p) => p.groupId === groupId)
            .forEach((p, index) => {
              const dx = ((index % 4) - 1.5) * 15,
                dy = ((Math.floor(index / 4) % 4) - 1.5) * 15;
              const node = {
                id: p.id,
                proposal: true,
                proposalId: p.proposalId,
                groupId,
                t: p.title,
                layer: "business",
                x: x + dx,
                z: z + 16 + Math.floor(index / 16) * 15,
                fx: x + dx,
                fy: dy,
                fz: z + 16 + Math.floor(index / 16) * 15,
              };
              nodes.push(node);
              byId.set(node.id, node);
              nb.set(node.id, new Set([node.id, group.id]));
              nb.get(group.id).add(node.id);
              links.push({ source: group.id, target: node.id, kind: "proposal" });
            });
        });
        document.querySelector(".bar h1").textContent = `Context changes · ${valid.length} pending`;
        G.graphData({ nodes, links });
        setTimeout(useShapes, 50);
        G.nodeVisibility((n) => vis(n)).linkVisibility((l) => vis(l.source) && vis(l.target));
        refresh();
        showRes();
      }
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        if (event.data?.type === "knowledge-nodes" && Array.isArray(event.data.nodes)) {
          showNodes(event.data.nodes);
          return;
        }
        if (event.data?.type === "knowledge-proposals") {
          showProposals(event.data.nodes);
          return;
        }
        if (event.data?.type === "knowledge-proposal-focus") {
          const n = byId.get(event.data.id);
          if (proposalMode && n?.proposal) pickNode(n);
          return;
        }
        if (event.data?.type === "knowledge-clear-selection") {
          sel = null;
          hover = null;
          refresh();
          return;
        }
        if (event.data?.type === "knowledge-focus") {
          const n = byId.get(event.data.id);
          if (n && vis(n)) pickNode(n);
          return;
        }
        if (event.data?.type !== "knowledge-scopes") return;
        Object.assign(scopes, event.data.scopes);
        if (sel && !scopeActive(sel)) {
          sel = null;
          hover = null;
          window.parent.postMessage({ type: "knowledge-selection-cleared" }, "*");
        }
        G.nodeVisibility((n) => vis(n)).linkVisibility((l) => vis(l.source) && vis(l.target));
        refresh();
        showRes();
      });
      window.parent.postMessage({ type: "knowledge-graph-ready", nodes: [] }, "*");
      let idleTimer;
      function redraw() {
        G.resumeAnimation();
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => G.pauseAnimation(), 100);
      }
      G.controls().enableDamping = false;
      G.controls().addEventListener("change", redraw);
      for (const event of ["pointermove", "pointerdown", "pointerleave"]) {
        document.getElementById("g").addEventListener(event, redraw);
      }
      redraw();
      addEventListener("resize", () => {
        G.width(innerWidth).height(innerHeight);
        redraw();
      });
    </script>
  </body>
</html>
