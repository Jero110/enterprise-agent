<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stacked layers</title>
    <style>
      :root {
        --bg: #fbfbfc;
        --ink: 20, 20, 24;
        --panel: #ffffffd9;
        --line: #e8e8ec;
        --muted: #8a8a94;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: rgb(var(--ink));
        font:
          13px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Inter",
          sans-serif;
        overflow: hidden;
      }
      #g {
        position: absolute;
        inset: 0;
      }
      .bar {
        position: absolute;
        left: 20px;
        top: 18px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
      }
      .bar h1 {
        font-size: 13px;
        font-weight: 500;
        margin: 0;
      }
      .bar h1 span {
        color: var(--muted);
        font-weight: 400;
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        pointer-events: auto;
      }
      .find {
        position: relative;
      }
      .find input {
        font: inherit;
        font-size: 12px;
        width: 200px;
        color: rgb(var(--ink));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 14px;
        outline: none;
      }
      .find input:focus {
        border-color: var(--muted);
      }
      .res {
        position: absolute;
        right: 0;
        top: 32px;
        width: 280px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 4px;
        display: none;
        box-shadow: 0 12px 36px #00000018;
        max-height: 300px;
        overflow: auto;
      }
      .res.show {
        display: block;
      }
      .res div {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 8px;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
      }
      .res div:hover,
      .res div.on {
        background: var(--hover, #f4f4f7);
      }
      .res i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }
      .res em {
        margin-left: auto;
        font-style: normal;
        color: var(--muted);
        font-size: 11px;
      }
      .res .none {
        color: var(--muted);
        cursor: default;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: rgb(var(--ink));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 12px;
        cursor: pointer;
        pointer-events: auto;
      }
      button:hover {
        border-color: var(--muted);
      }
      .layers {
        position: absolute;
        left: 20px;
        top: 56px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lc {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        cursor: pointer;
        color: rgb(var(--ink));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 12px 3px 10px;
        width: max-content;
      }
      .lc i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgb(var(--ink));
      }
      .lc em {
        font-style: normal;
        color: var(--muted);
        font-size: 11px;
      }
      .lc.off {
        color: var(--muted);
      }
      .key {
        position: absolute;
        left: 14px;
        bottom: 12px;
        display: flex;
        gap: 16px;
        color: var(--muted);
        font-size: 11.5px;
        pointer-events: none;
        background: #fbfbfcd9;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 14px;
      }
      .key i {
        display: inline-block;
        vertical-align: middle;
        margin-right: 7px;
        border-radius: 50%;
      }
      .key i.barrel {
        width: 9px;
        height: 11px;
        border-radius: 5px/3px;
        background: #9aa1a8;
      }
      .key .a {
        margin-left: 4px;
      }
      .key .a i {
        width: 8px;
        height: 8px;
      }
    </style>
  </head>
  <body>
    <div id="g"></div>
    <div class="bar">
      <h1>
        Current context <span>&middot; 4 layers &middot; <span id="n"></span> nodes</span>
      </h1>
      <div class="tools">
        <div class="find">
          <input id="q" placeholder="Find a node" autocomplete="off" spellcheck="false" />
          <div class="res" id="res"></div>
        </div>
        <button id="reset">Reset view</button>
      </div>
    </div>
    <div class="layers" id="layers"></div>
    <div class="key">
      <span><i style="width: 10px; height: 10px; background: #9aa1a8"></i>Source</span
      ><span><i style="width: 3px; height: 3px; background: #9aa1a8"></i>Document</span>
    </div>

    <script>
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
      window.cancelAnimationFrame = (id) => clearTimeout(id);
    </script>
    <script src="/context-graph/3d-force-graph.min.js"></script>
    <script>
      function rng(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const R = rng(9);
      const RAD = 170,
        GAP = 124;
      const LAYERS = [
        {
          id: "metrics",
          name: "Metrics",
          y: GAP * 1.5,
          src: [
            { t: "Agent adoption", o: "Platform", n: 16 },
            { t: "Cost and tokens", o: "Platform", n: 20 },
            { t: "Delivery speed", o: "Ledger", n: 14 },
            { t: "Risk indicators", o: "Risk", n: 12 },
            { t: "Support load", o: "Accounts", n: 10 },
          ],
        },
        {
          id: "business",
          name: "Business",
          y: GAP * 0.5,
          src: [
            { t: "Payment lifecycle", o: "Ledger", n: 22 },
            { t: "Fee policy", o: "Accounts", n: 14 },
            { t: "Fraud rules", o: "Risk", n: 16 },
            { t: "Onboarding", o: "Accounts", n: 12 },
            { t: "Settlement", o: "Ledger", n: 18 },
          ],
        },
        {
          id: "ai",
          name: "AI",
          y: -GAP * 0.5,
          src: [
            { t: "ingest CLI", o: "Platform", n: 12 },
            { t: "knowledge MCP", o: "Platform", n: 14 },
            { t: "Ledger services", o: "Ledger", n: 20 },
            { t: "Frontend gateway", o: "Frontend", n: 12 },
            { t: "Skills", o: "Platform", n: 16 },
            { t: "postgres MCP", o: "Platform", n: 8 },
          ],
        },
        {
          id: "data",
          name: "Data",
          y: -GAP * 1.5,
          src: [
            { t: "ledger-db", o: "Ledger", n: 34 },
            { t: "users-db", o: "Accounts", n: 22 },
            { t: "event-log", o: "Platform", n: 28 },
            { t: "warehouse", o: "Platform", n: 24 },
            { t: "fraud-labels", o: "Risk", n: 16 },
            { t: "price-feed", o: "Ledger", n: 12 },
            { t: "ui-telemetry", o: "Frontend", n: 14 },
          ],
        },
      ];
      const MY = new Set(["Ledger"]);
      const hx = (h) => [
        parseInt(h.slice(1, 3), 16),
        parseInt(h.slice(3, 5), 16),
        parseInt(h.slice(5, 7), 16),
      ];
      const tint = (base, c, k) => {
        const A = hx(base),
          B = hx(c);
        return (
          "#" +
          A.map((v, i) =>
            Math.round(v * (1 - k) + B[i] * k)
              .toString(16)
              .padStart(2, "0"),
          ).join("")
        );
      };
      const LC = { data: "#5f9e9c", ai: "#53659f", business: "#9a88c7", metrics: "#c68399" };
      const nodes = [],
        links = [],
        hubs = [];
      LAYERS.forEach((L, li) => {
        L.src.forEach((s, i) => {
          const ang = (i / L.src.length) * Math.PI * 2 + li * 0.5,
            rr = RAD * 0.5;
          const hub = {
            id: `h${li}_${i}`,
            hub: true,
            layer: L.id,
            li,
            t: s.t,
            owner: s.o,
            mine: MY.has(s.o),
            deg: s.n,
            x: Math.cos(ang) * rr,
            z: Math.sin(ang) * rr,
            fy: L.y,
          };
          nodes.push(hub);
          hubs.push(hub);
          for (let k = 0; k < s.n; k++) {
            const d = {
              id: `d${li}_${i}_${k}`,
              t: `${s.t} / doc ${k + 1}`,
              layer: L.id,
              li,
              owner: s.o,
              mine: hub.mine,
              src: s.t,
              x: hub.x + (R() - 0.5) * 60,
              z: hub.z + (R() - 0.5) * 60,
              fy: L.y,
            };
            nodes.push(d);
            links.push({ source: hub.id, target: d.id, kind: "leaf", d: 16 + R() * R() * 60 });
          }
        });
        // sources inside a layer reference each other
        for (let a = 0; a < L.src.length; a++)
          links.push({
            source: `h${li}_${a}`,
            target: `h${li}_${(a + 1) % L.src.length}`,
            kind: "hub",
          });
      });
      // links between layers: sources reach the layer below, and a few documents reach across
      hubs.forEach((h) => {
        if (h.li < 3) {
          const below = hubs.filter((o) => o.li === h.li + 1);
          for (let c = 0; c < 2; c++) {
            const t = below[Math.floor(R() * below.length)];
            links.push({ source: h.id, target: t.id, kind: "cross" });
          }
        }
      });
      const docs = nodes.filter((n) => !n.hub);
      for (let c = 0; c < 80; c++) {
        const a = docs[Math.floor(R() * docs.length)];
        const lower = docs.filter((n) => n.li === Math.min(3, a.li + 1 + Math.floor(R() * 2)));
        const b = lower[Math.floor(R() * lower.length)];
        if (b && b.li !== a.li) links.push({ source: a.id, target: b.id, kind: "cross" });
      }
      for (let li = 0; li < 4; li++) {
        const ld = docs.filter((n) => n.li === li);
        for (let c = 0; c < 38; c++) {
          const a = ld[Math.floor(R() * ld.length)],
            b = ld[Math.floor(R() * ld.length)];
          if (a !== b && a.src !== b.src) links.push({ source: a.id, target: b.id, kind: "ref" });
        }
      }
      // faint ring of dots marks each layer's edge, no extra geometry needed
      LAYERS.forEach((L, li) => {
        for (let k = 0; k < 110; k++) {
          const a = (k / 110) * Math.PI * 2;
          nodes.push({
            id: `r${li}_${k}`,
            ring: true,
            layer: L.id,
            li,
            fx: Math.cos(a) * (RAD + 10),
            fz: Math.sin(a) * (RAD + 10),
            fy: L.y,
            x: Math.cos(a) * (RAD + 10),
            z: Math.sin(a) * (RAD + 10),
          });
        }
      });
      document.getElementById("n").textContent = docs.length;

      const byId = new Map(nodes.map((n) => [n.id, n]));
      const ob = (x) => (typeof x === "object" ? x : byId.get(x));
      const nb = new Map(nodes.map((n) => [n.id, new Set([n.id])]));
      links.forEach((l) => {
        nb.get(l.source).add(l.target);
        nb.get(l.target).add(l.source);
      });
      const hidden = new Set();
      let hover = null,
        sel = null;
      const scopes = { general: true, area: true, individual: true };
      let proposalMode = false;
      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
        );
      const scopeOf = (n) =>
        n.owner === "Platform" ? "general" : n.owner === "Frontend" ? "individual" : "area";
      const scopeActive = (n) => n.ring || n.proposal || n.proposalGroup || scopes[scopeOf(n)];
      const describe = (n) => ({
        id: n.id,
        title: n.t,
        layer: n.layer,
        scope: scopeOf(n),
        kind: n.hub ? "source" : "document",
        owner: n.owner,
        connections: [...nb.get(n.id)]
          .filter((id) => id !== n.id)
          .map((id) => byId.get(id)?.t)
          .filter(Boolean)
          .slice(0, 6),
      });
      const vis = (n) => n.proposal || n.proposalGroup || !hidden.has(ob(n).layer);
      const lit = (n) => {
        if (proposalMode && !n.proposal && !n.proposalGroup) return false;
        const f = hover || sel;
        return !f || nb.get(f.id).has(n.id);
      };
      const mixW = (h, t) => {
        const n = parseInt(h.slice(1), 16),
          f = (c) =>
            Math.round(c + (255 - c) * t)
              .toString(16)
              .padStart(2, "0");
        return "#" + f(n >> 16) + f((n >> 8) & 255) + f(n & 255);
      };
      // grey dots with only a hint of the layer colour
      const nodeColor = (n) => {
        if (proposalMode && n.proposal) return "#ea580c";
        if (proposalMode && n.proposalGroup) return "#f97316";
        if (n.ring) return "#dcdee2";
        if (proposalMode) return "#e3e4e7";
        if (n.isNew) return "#f59e0b";
        const c = n.hub ? tint("#6a6e76", LC[n.layer], 0.5) : tint("#a3a7ad", LC[n.layer], 0.42);
        return !scopeActive(n) ? mixW(c, 0.55) : lit(n) ? c : mixW(c, 0.85);
      };
      const dotOp = (n) =>
        proposalMode
          ? n.proposal
            ? 1
            : n.proposalGroup
              ? 0.9
              : n.ring
                ? 0.08
                : 0.14
          : n.isNew
            ? 1
            : !scopeActive(n)
              ? n.hub
                ? 0.32
                : 0.2
              : !lit(n)
                ? 0.12
                : n.hub
                  ? 1
                  : 0.9;
      const linkColor = (l) => {
        if (proposalMode) return l.kind === "proposal" ? "#fb923c" : "#eceef0";
        const f = hover || sel,
          a = ob(l.source),
          b = ob(l.target);
        const on = f && (a === f || b === f);
        if (!scopeActive(a) || !scopeActive(b)) return "#f1f2f4";
        if (f) return on ? "#5d666e" : "#f0f2f3";
        return l.kind === "leaf"
          ? "#d6dadd"
          : l.kind === "hub"
            ? "#97a0a8"
            : l.kind === "ref"
              ? "#c9cfd3"
              : "#b5bfc4";
      };

      const G = ForceGraph3D()(document.getElementById("g"))
        .backgroundColor("#fbfbfc")
        .showNavInfo(false)
        .graphData({ nodes, links })
        .nodeId("id")

        .nodeLabel((n) =>
          n.ring
            ? ""
            : `<div style="font:12px -apple-system,Inter,sans-serif;background:#17171aee;color:#fff;padding:3px 9px;border-radius:7px">${escapeHtml(n.t)}</div>`,
        )
        .nodeVisibility((n) => vis(n))
        .linkVisibility((l) => vis(l.source) && vis(l.target))
        .linkColor(linkColor)
        .linkOpacity(0.6)
        .linkWidth((l) => (l.kind === "cross" ? 0.3 : l.kind === "hub" ? 0.8 : 0.18))
        .linkCurvature((l) => (l.kind === "cross" ? 0.12 : 0))
        .enableNodeDrag(false)
        .warmupTicks(80)
        .cooldownTicks(220)
        .d3VelocityDecay(0.3)
        .onNodeHover((n) => {
          hover = n && !n.ring && (!proposalMode || n.proposal || n.proposalGroup) ? n : null;
          document.getElementById("g").style.cursor = hover ? "pointer" : "grab";
          refresh();
        })
        .onNodeClick((n) => {
          if (proposalMode) {
            const proposal = n?.proposal
              ? n
              : n?.proposalGroup
                ? nodes.find((entry) => entry.proposal && entry.groupId === n.groupId)
                : null;
            if (proposal) pickNode(proposal);
            return;
          }
          if (!n.ring) {
            sel = n;
            refresh();
            window.parent.postMessage({ type: "knowledge-node-selected", node: describe(n) }, "*");
          }
        })
        .onBackgroundClick(() => {
          sel = null;
          hover = null;
          refresh();
          window.parent.postMessage(
            { type: proposalMode ? "knowledge-proposal-cleared" : "knowledge-selection-cleared" },
            "*",
          );
        });
      // reuse the library's own three.js classes: once the first default sphere exists, borrow its Mesh, material and geometry
      let SG,
        BG,
        Mesh,
        Mat,
        ringMat,
        r0 = 4;
      function mk(n) {
        if (n.ring) {
          const m = new Mesh(SG, ringMat);
          m.scale.setScalar(0.9 / r0);
          return m;
        }
        // flat dots: black base + emissive colour, so lights never shade them
        const mat = new Mat({
          color: "#000000",
          emissive: nodeColor(n),
          transparent: true,
          opacity: dotOp(n),
        });
        n.__mat = mat;
        const m = new Mesh(SG, mat);
        m.scale.setScalar(
          (n.proposalGroup ? 6 : n.proposal ? 4.5 : n.isNew ? 4.4 : n.hub ? 4.2 : 1.6) / r0,
        );
        if (n.isNew) {
          // a static halo marks the newly ingested node; nothing animates
          const halo = new Mesh(
            SG,
            new Mat({ color: "#000000", emissive: "#f59e0b", transparent: true, opacity: 0.28 }),
          );
          halo.scale.setScalar(2.3);
          m.add(halo);
        }
        return m;
      }
      function useShapes() {
        const pm = nodes.find((n) => n.__threeObj)?.__threeObj;
        if (!pm) return setTimeout(useShapes, 150);
        Mesh = pm.constructor;
        Mat = pm.material.constructor;
        SG = pm.geometry;
        r0 = SG.parameters.radius;
        BG = SG.clone();
        const P = BG.attributes.position;
        for (let i = 0; i < P.count; i++) {
          let x = P.getX(i) / r0,
            y = P.getY(i) / r0,
            z = P.getZ(i) / r0,
            y2;
          if (Math.abs(y) > 0.7) {
            y2 = Math.sign(y);
            x /= 0.714;
            z /= 0.714;
          } else {
            const l = Math.hypot(x, z) || 1;
            x /= l;
            z /= l;
            y2 = y / 0.7;
          }
          P.setXYZ(i, x * r0, y2 * 0.85 * r0, z * r0);
        }
        P.needsUpdate = true;
        BG.computeVertexNormals();
        ringMat = new Mat({ color: "#dcdee2" });
        G.nodeThreeObject(mk);
      }
      setTimeout(useShapes, 300);
      // each layer is a closed disc: nodes never leave their level, links are the only thing that cross
      function disc() {
        let ns = [];
        const f = (a) => {
          for (const n of ns) {
            if (n.ring) continue;
            const d = Math.hypot(n.x, n.z);
            if (d > RAD) {
              const k = ((RAD - d) / d) * a * 6;
              n.vx += n.x * k;
              n.vz += n.z * k;
            }
          }
        };
        f.initialize = (x) => {
          ns = x;
        };
        return f;
      }
      G.d3Force("disc", disc());
      G.d3Force("link")
        .distance((l) =>
          l.kind === "leaf" ? l.d : l.kind === "hub" ? 80 : l.kind === "ref" ? 70 : 100,
        )
        .strength((l) =>
          l.kind === "leaf" ? 0.9 : l.kind === "hub" ? 0.15 : l.kind === "ref" ? 0.01 : 0,
        );
      G.d3Force("charge")
        .strength((n) => (n.ring ? 0 : n.hub ? -110 : -8))
        .distanceMax(95);
      const HOME = { x: 0, y: 0, z: 600 };
      function resetView() {
        G.camera().up.set(0, 1, 0);
        G.cameraPosition(HOME, { x: 0, y: 0, z: 0 }, 0);
      }
      resetView();
      function refresh() {
        nodes.forEach((n) => {
          if (n.__mat) {
            n.__mat.emissive.set(nodeColor(n));
            n.__mat.opacity = dotOp(n);
          }
        });
        G.linkColor(linkColor);
      }
      function renderChips() {
        document.getElementById("layers").innerHTML = LAYERS.map(
          (L) =>
            `<div class="lc ${hidden.has(L.id) ? "off" : ""}" data-l="${L.id}"><i style="background:${hidden.has(L.id) ? "#d6d6dc" : tint("#6a6e76", LC[L.id], 0.5)}"></i>${L.name}<em>${nodes.filter((n) => !n.ring && n.layer === L.id).length}</em></div>`,
        ).join("");
        document.querySelectorAll(".lc").forEach(
          (c) =>
            (c.onclick = () => {
              const l = c.dataset.l;
              hidden.has(l) ? hidden.delete(l) : hidden.add(l);
              if (sel && hidden.has(sel.layer)) {
                sel = null;
                hover = null;
                window.parent.postMessage({ type: "knowledge-selection-cleared" }, "*");
              }
              G.nodeVisibility((n) => vis(n)).linkVisibility((l) => vis(l.source) && vis(l.target));
              renderChips();
              window.parent.postMessage({ type: "knowledge-layers", hidden: [...hidden] }, "*");
            }),
        );
      }
      renderChips();
      // finder: filter by name and fly the camera to the pick
      const q = document.getElementById("q"),
        res = document.getElementById("res");
      let found = [],
        cur = 0;
      function showRes() {
        const t = q.value.trim().toLowerCase();
        if (!t) {
          res.classList.remove("show");
          found = [];
          return;
        }
        found = nodes
          .filter(
            (n) => (proposalMode ? n.proposal : !n.ring) && vis(n) && n.t.toLowerCase().includes(t),
          )
          .sort((a, b) => b.hub - a.hub || a.t.localeCompare(b.t))
          .slice(0, 8);
        cur = 0;
        res.innerHTML = found.length
          ? found
              .map(
                (n, i) =>
                  `<div data-i="${i}" class="${i ? "" : "on"}"><i style="background:${proposalMode ? "#ea580c" : tint("#6a6e76", LC[n.layer], 0.5)}"></i>${escapeHtml(n.t)}<em>${proposalMode ? "Pending" : LAYERS.find((l) => l.id === n.layer).name}</em></div>`,
              )
              .join("")
          : '<div class="none">No node with that name</div>';
        res.classList.add("show");
        res
          .querySelectorAll("[data-i]")
          .forEach((d) => (d.onclick = () => pickNode(found[+d.dataset.i])));
      }
      function pickNode(n) {
        if (!n) return;
        sel = n;
        refresh();
        res.classList.remove("show");
        q.blur();
        window.parent.postMessage(
          proposalMode
            ? { type: "knowledge-proposal-selected", id: n.proposalId }
            : { type: "knowledge-node-selected", node: describe(n) },
          "*",
        );
        G.cameraPosition(
          { x: n.x + 145, y: n.fy + 100, z: n.z + 290 },
          { x: n.x, y: n.fy, z: n.z },
          900,
        );
      }
      q.addEventListener("input", showRes);
      q.addEventListener("keydown", (e) => {
        if (e.key === "Enter") pickNode(found[cur]);
        else if (e.key === "Escape") {
          q.value = "";
          showRes();
          q.blur();
        } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          cur = Math.max(0, Math.min(found.length - 1, cur + (e.key === "ArrowDown" ? 1 : -1)));
          res.querySelectorAll("[data-i]").forEach((d, i) => d.classList.toggle("on", i === cur));
        }
      });
      document.getElementById("reset").onclick = resetView;
      function showProposals(proposals) {
        proposalMode = true;
        for (let i = nodes.length - 1; i >= 0; i--) {
          if (nodes[i].proposal || nodes[i].proposalGroup) {
            byId.delete(nodes[i].id);
            nb.delete(nodes[i].id);
            nodes.splice(i, 1);
          }
        }
        for (let i = links.length - 1; i >= 0; i--) {
          if (links[i].kind === "proposal") links.splice(i, 1);
        }
        sel = null;
        hover = null;
        const valid = Array.isArray(proposals)
          ? proposals
              .filter(
                (p) =>
                  p &&
                  typeof p.id === "string" &&
                  typeof p.proposalId === "string" &&
                  typeof p.groupId === "string" &&
                  typeof p.title === "string" &&
                  typeof p.groupLabel === "string",
              )
              .slice(0, 300)
          : [];
        const groups = [...new Map(valid.map((p) => [p.groupId, p.groupLabel])).entries()].sort(
          ([a], [b]) => a.localeCompare(b),
        );
        groups.forEach(([groupId, groupLabel], groupIndex) => {
          const angle = (groupIndex / groups.length) * Math.PI * 2 - Math.PI / 2;
          const x = Math.cos(angle) * 245,
            z = Math.sin(angle) * 245;
          const group = {
            id: `proposal-group:${groupId}`,
            proposalGroup: true,
            groupId,
            t: groupLabel,
            layer: "business",
            x,
            z,
            fx: x,
            fy: 0,
            fz: z,
          };
          nodes.push(group);
          byId.set(group.id, group);
          nb.set(group.id, new Set([group.id]));
          valid
            .filter((p) => p.groupId === groupId)
            .forEach((p, index) => {
              const dx = ((index % 4) - 1.5) * 15,
                dy = ((Math.floor(index / 4) % 4) - 1.5) * 15;
              const node = {
                id: p.id,
                proposal: true,
                proposalId: p.proposalId,
                groupId,
                t: p.title,
                layer: "business",
                x: x + dx,
                z: z + 16 + Math.floor(index / 16) * 15,
                fx: x + dx,
                fy: dy,
                fz: z + 16 + Math.floor(index / 16) * 15,
              };
              nodes.push(node);
              byId.set(node.id, node);
              nb.set(node.id, new Set([node.id, group.id]));
              nb.get(group.id).add(node.id);
              links.push({ source: group.id, target: node.id, kind: "proposal" });
            });
        });
        document.querySelector(".bar h1").textContent = `Context changes · ${valid.length} pending`;
        G.graphData({ nodes, links });
        G.nodeVisibility((n) => vis(n)).linkVisibility((l) => vis(l.source) && vis(l.target));
        refresh();
        showRes();
      }
      // Injected knowledge: hubs are key nodes, leaves are documents. Nodes already on the map keep
      // their position, so adding one document never re-lays out the rest.
      let shownSignature = "";
      function showNodes(previews) {
        // the parent resends the same map after unrelated refetches; rebuilding it is the lag
        const signature = JSON.stringify(previews);
        if (!proposalMode && signature === shownSignature) return;
        shownSignature = signature;
        proposalMode = false;
        const placed = new Map();
        for (const n of nodes)
          if (!n.ring && Number.isFinite(n.x)) placed.set(n.id, { x: n.x, z: n.z });
        const rings = nodes.filter((n) => n.ring);
        nodes.length = 0;
        nodes.push(...rings);
        links.length = 0;
        hubs.length = 0;
        docs.length = 0;
        byId.clear();
        nb.clear();
        rings.forEach((n) => {
          byId.set(n.id, n);
          nb.set(n.id, new Set([n.id]));
        });
        const rand = rng(9);
        const ownerOf = (p) =>
          p.areaId === "general" ? "Platform" : p.areaId === "personal" ? "Frontend" : p.areaId;
        const hubCount = new Map();
        const hubIndex = new Map();
        for (const p of previews)
          if (p.hub) {
            hubIndex.set(p.id, hubCount.get(p.layer) || 0);
            hubCount.set(p.layer, (hubCount.get(p.layer) || 0) + 1);
          }
        const hubOf = new Map();
        for (const p of previews) if (p.hub) hubOf.set(p.id, p);
        const make = (p) => {
          const li = LAYERS.findIndex((l) => l.id === p.layer);
          if (li < 0) return null;
          const kept = placed.get(p.id);
          let x, z;
          if (kept) ({ x, z } = kept);
          else if (p.hub) {
            const ang = (hubIndex.get(p.id) / hubCount.get(p.layer)) * Math.PI * 2 + li * 0.5;
            x = Math.cos(ang) * RAD * 0.5;
            z = Math.sin(ang) * RAD * 0.5;
          } else {
            const hub = (p.links || []).map((id) => byId.get(id)).find((n) => n?.hub);
            x = (hub ? hub.x : 0) + (rand() - 0.5) * 60;
            z = (hub ? hub.z : 0) + (rand() - 0.5) * 60;
          }
          const node = {
            id: p.id,
            t: p.title,
            hub: Boolean(p.hub),
            isNew: Boolean(p.isNew),
            layer: p.layer,
            li,
            owner: ownerOf(p),
            areaId: p.areaId,
            x,
            z,
            fy: LAYERS[li].y,
            ...(kept ? { fx: x, fz: z } : {}),
          };
          nodes.push(node);
          (p.hub ? hubs : docs).push(node);
          byId.set(node.id, node);
          nb.set(node.id, new Set([node.id]));
          return node;
        };
        previews.filter((p) => p.hub).forEach(make);
        previews.filter((p) => !p.hub).forEach(make);
        for (const p of previews)
          for (const target of p.links || []) {
            const a = byId.get(p.id),
              b = byId.get(target);
            if (!a || !b) continue;
            const kind =
              a.layer !== b.layer
                ? "cross"
                : a.hub && b.hub
                  ? "hub"
                  : a.hub || b.hub
                    ? "leaf"
                    : "ref";
            links.push(
              kind === "leaf"
                ? { source: p.id, target, kind, d: 16 + rand() * rand() * 60 }
                : { source: p.id, target, kind },
            );
            nb.get(p.id).add(target);
            nb.get(target).add(p.id);
          }
        sel = sel ? byId.get(sel.id) || null : null;
        hover = null;
        document.getElementById("n").textContent = nodes.length - rings.length;
        G.graphData({ nodes, links });
        G.nodeVisibility((n) => vis(n)).linkVisibility((l) => vis(l.source) && vis(l.target));
        renderChips();
        refresh();
        showRes();
      }
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        if (event.data?.type === "knowledge-nodes" && Array.isArray(event.data.nodes)) {
          showNodes(event.data.nodes);
          return;
        }
        if (event.data?.type === "knowledge-proposals") {
          showProposals(event.data.nodes);
          return;
        }
        if (event.data?.type === "knowledge-proposal-focus") {
          const n = byId.get(event.data.id);
          if (proposalMode && n?.proposal) pickNode(n);
          return;
        }
        if (event.data?.type === "knowledge-clear-selection") {
          sel = null;
          hover = null;
          refresh();
          return;
        }
        if (event.data?.type === "knowledge-focus") {
          const n = byId.get(event.data.id);
          if (n && vis(n)) pickNode(n);
          return;
        }
        if (event.data?.type !== "knowledge-scopes") return;
        const unchanged = Object.keys(scopes).every(
          (key) => scopes[key] === event.data.scopes[key],
        );
        if (unchanged) return;
        Object.assign(scopes, event.data.scopes);
        if (sel && !scopeActive(sel)) {
          sel = null;
          hover = null;
          window.parent.postMessage({ type: "knowledge-selection-cleared" }, "*");
        }
        G.nodeVisibility((n) => vis(n)).linkVisibility((l) => vis(l.source) && vis(l.target));
        refresh();
        showRes();
      });
      window.parent.postMessage({ type: "knowledge-graph-ready", nodes: hubs.map(describe) }, "*");
      addEventListener("resize", () => G.width(innerWidth).height(innerHeight));
    </script>
  </body>
</html>
